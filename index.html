splay:block;margin-bottom:6px;font-size:16px}.status .label{font-weight:650;font-size:15px}.status p{font-size:14px;margin:8px 0 0}.feedback{border:1px solid var(--line);border-radius:10px;background:white;padding:16px;margin:14px 0}.feedback p{margin:8px 0;font-size:15px}.hint{background:var(--yellow);padding:14px;border-radius:9px;margin-top:12px;font-size:16px}.answer-feedback{background:white;border:1px solid var(--line);padding:16px;border-radius:10px;margin:14px 0}.answer-feedback.good{border-left:4px solid #518365}.answer-feedback.again{border-left:4px solid #b39a46}.balance{display:grid;grid-template-columns:1fr 45px 1fr;gap:8px;align-items:center;margin:20px 0}.pan{border-bottom:3px solid #5e7c92;text-align:center;padding:16px 6px}.objects{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.box{display:inline-grid;place-items:center;border:2px solid #668aa5;background:#fff;padding:8px;min-width:42px;font-weight:650}.units{background:#fff;padding:8px 12px;border:1px solid #91a8ba;border-radius:5px}.balance .equals{text-align:center;font-size:30px}.visual-note{font-size:14px;text-align:center}.operation-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.operation-grid select{width:100%}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;margin:18px 0}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:10px 8px;overflow-wrap:anywhere}th{background:#edf2f5}.log{border-left:3px solid #b3c5d3;padding:10px 16px;margin:15px 0}.log p{margin:6px 0;font-size:15px}.banner{background:#edf2f5;padding:16px;border-radius:10px;margin:16px 0}.report-area details{border-top:1px solid var(--line);padding:8px 0}.hidden{display:none!important}.report-tools{display:flex;gap:12px;flex-wrap:wrap}.footer{font-size:12px;text-align:center;margin-top:24px;color:var(--muted)}hr{border:0;border-top:1px solid var(--line);margin:24px 0}.phase-steps{font-size:14px;color:var(--muted)}.token-row{display:flex;gap: <header><div class="head"><div class="brand">Mathetrainer · Gleichungen</div><div id="mode" class="mode">Start</div></div></header>
<noscript><p class="noscript">Dieser Trainer benötigt JavaScript. Bitte aktiviere JavaScript in deinem Browser.</p></noscript>
<main id="app"></main>
<div class="footer">Klassen 7–10 · Version 1.0 · 1. Oktober 2026</div>
<script>
(()=>{'use strict';
const F=(a,b)=>`<span class="frac" aria-label="${a} durch ${b}"><span>${a}</span><span>${b}</span></span>`;
const EQ=s=>`<span class="equation">${s}</span>`;
const N=(q,answer,explain,tags={},extra={})=>({type:'number',q,answer:Array.isArray(answer)?answer:[answer],explain,tags,own:true,...extra});
const M=(q,opts,c,explain,tags={},extra={})=>({type:'mc',q,opts,c,explain,tags,own:false,...extra});
const E=(q,coeff,explain,extra={})=>({type:'expr',q,coeff,explain,own:true,tags:{},...extra});
const P=(q,opts,correct,explain,tags={},extra={})=>({type:'pick',q,opts,correct,explain,tags,own:true,...extra});
const O=(q,opts,c,explain,extra={})=>({type:'operation',q,opts,c,explain,own:true,tags:{},...extra});
const balance=(boxes,units,right)=>`<div class="balance" role="img" aria-label="${boxes} gleich schwere Kästchen und ${units} Einheiten links, ${right} Einheiten rechts; beide Seiten sind gleich schwer."><div class="pan"><div class="objects">${Array.from({length:boxes},()=>'<span class="box">x</span>').join('')}<span class="units">+ ${units}</span></div></div><div class="equals">=</div><div class="pan"><span class="units">${right} Einheiten</span></div></div><p class="visual-note">Jedes Kästchen hat denselben Wert x. Beide Seiten haben denselben Gesamtwert.</p>`;
const TAGS={
 result:'Vielleicht liest du das Gleichheitszeichen als „danach kommt das Ergebnis“. Es verbindet zwei Terme mit demselben Wert.',
 oneSide:'Deine Antworten passen zu einer Veränderung auf nur einer Seite. Eine Äquivalenzumformung muss die Lösungsmenge erhalten.',
 sign:'Vielleicht geht das Minuszeichen beim Rechnen verloren. Es gehört zum jeweiligen Term beziehungsweise Faktor.',
 inverse:'Vielleicht wird eine Rechenoperation durch dieselbe Operation statt durch ihre Umkehroperation rückgängig gemacht.',
 divideSum:'Vielleicht wird beim Teilen nur ein Teil der Summe geteilt. Die Operation gilt für den gesamten Term auf jeder Seite.',
 bracket:'Vielleicht wird der Faktor vor der Klammer nur auf einen Summanden angewandt.',
 fraction:'Vielleicht bleibt beim Beseitigen des Nenners ein Teil des Terms unberücksichtigt.',
 allNone:'Vielleicht wird aus einer Gleichung ohne x automatisch x = 0. Entscheidend ist, ob die entstandene Aussage wahr oder falsch ist.',
 model:'Vielleicht werden feste Beiträge, wiederholte Beiträge oder die Reihenfolge der beschriebenen Operationen vertauscht.',
 positiveOnly:'Vielleicht wird nur die positive Lösung berücksichtigt. Eine negative Zahl kann dasselbe Quadrat besitzen.',
 rootValue:'Vielleicht werden Quadrat und Wurzel verwechselt. Gesucht sind die Zahlen, deren Quadrat den angegebenen Wert ergibt.',
 lostZero:'Vielleicht wird durch x geteilt und dabei x = 0 ausgeschlossen. Prüfe diese Möglichkeit, bevor du durch x teilst.',
 factorSign:'Vielleicht wird der Vorzeichenwechsel beim Nullsetzen eines Faktors übersehen.',
 zeroProduct:'Vielleicht wird „mindestens ein Faktor ist null“ mit „beide Faktoren sind null“ verwechselt.',
 nonzeroProduct:'Vielleicht wird der Satz vom Nullprodukt auch bei einem Produkt angewandt, das nicht null ist.'
};
const DIMS=[
{id:'equal',name:'Gleichheitszeichen und Lösungen',grade:7,goal:'Gleichheit als Beziehung deuten; eine Lösung durch Einsetzen oder eine eigene Handlung belegen.',source:'SMART; Otten et al. (2019)',tip:'Berechne oder betrachte beide Seiten getrennt. Welcher Wert macht sie gleich?',strategy:'Setze deine gefundene Zahl in die ursprüngliche Gleichung ein und vergleiche beide Seiten.',
 base:[
 N('Welche Zahl gehört in die Lücke?'+EQ('8 + 4 = x + 5'),7,'Links steht 12. Rechts muss ebenfalls 12 stehen: 7 + 5 = 12.',{'12':'result','17':'result'}),
 M('Welche Zahl ist eine Lösung?'+EQ('3x + 2 = 14'),['x = 12','x = 16','x = 4','x = 14'],2,'Für x = 4 gilt 3 · 4 + 2 = 14. Eine Lösung macht die Gleichung wahr.',{0:'result',1:'inverse',3:'result'})],
 probes:[
 N('Welchen Wert hat ein Kästchen?'+balance(2,3,11),4,'Zwei Kästchen haben zusammen 8 Einheiten, also hat ein Kästchen 4.',{}, {representation:'Waagenmodell'}),
 N('Ergänze so, dass beide Seiten denselben Wert haben.'+EQ('6 + 9 = 7 + x'),8,'Beide Seiten sind dann 15.',{'15':'result','22':'result'})],
 practice:[[
 N('Bestimme den Wert eines Kästchens.'+balance(3,6,24),6,'24 − 6 = 18; diese 18 Einheiten gehören zu 3 Kästchen. Jedes hat den Wert 6.',{}, {tip:'Entferne gedanklich auf beiden Seiten 6 Einheiten.',help:'Drei Kästchen entsprechen dann 18 Einheiten. Teile diesen Wert auf die drei gleichen Kästchen auf.'}),
 O('Auf beiden Seiten soll der Beitrag + 8 verschwinden. Wähle die passende Operation links und rechts.'+EQ('2x + 8 = 26'),['− 8','+ 8','÷ 2'],0,'Auf beiden Seiten − 8 ergibt 2x = 18. Der Gesamtwert beider Seiten bleibt gleich.',{after:['2x','18'],tip:'Welche Operation hebt + 8 auf?',help:'Die Gleichheit bleibt erhalten, wenn du dieselbe zulässige Operation auf beide Seiten anwendest.'})],[
 N('Fülle die Lücke und prüfe beide Seiten.'+EQ('7 + 10 = x + 9'),8,'17 = 8 + 9; beide Seiten haben denselben Wert.',{}, {tip:'Bestimme zuerst den Wert links.',help:'Rechts müssen x und 9 zusammen denselben Wert ergeben wie 7 und 10.'}),
 M('Prüfe x = 5. Welche Probe ist richtig?'+EQ('4x − 3 = 17'),['4 · 5 − 3 = 17','4 · (5 − 3) = 17','4 + 5 − 3 = 17','5 − 3 = 17'],0,'4 · 5 − 3 = 20 − 3 = 17. x wird durch 5 ersetzt; die Termstruktur bleibt erhalten.',{}, {tip:'Ersetze nur x durch die Zahl 5.',help:'4x bedeutet 4 · x. Das − 3 steht außerhalb dieser Multiplikation.'})]],
 checks:[[
 N('Welche Zahl macht die Gleichung wahr?'+EQ('9 + 5 = x + 6'),8,'9 + 5 = 14 und 8 + 6 = 14.',{'14':'result','20':'result'}),
 M('Welche Zahl ist eine Lösung?'+EQ('4x + 1 = 25'),['x = 24','x = 26','x = 6','x = 25'],2,'4 · 6 + 1 = 25.',{0:'inverse',1:'inverse',3:'result'}),
 N('Welche Zahl gehört in die Lücke?'+EQ('11 + 7 = x + 10'),8,'18 = 8 + 10.',{'18':'result'})],[
 N('Welche Zahl macht beide Seiten gleich?'+EQ('13 + 8 = x + 10'),11,'21 = 11 + 10.',{'21':'result'}),
 M('Welche Zahl erfüllt die Gleichung?'+EQ('5x + 4 = 39'),['x = 35','x = 43','x = 7','x = 39'],2,'5 · 7 + 4 = 39.',{0:'inverse',3:'result'}),
 N('Ergänze den Wert von x.'+EQ('15 + 9 = x + 13'),11,'24 = 11 + 13.',{'24':'result'})]]},
{id:'inverse',name:'Umkehroperationen und Vorzeichen',grade:7,goal:'Einfache lineare Gleichungen selbstständig lösen; negative Faktoren berücksichtigen.',source:'SMART; eigene mathematisch geprüfte Aufgaben',tip:'Welche Operation wurde mit x zuletzt ausgeführt? Mache sie auf beiden Seiten rückgängig.',strategy:'Notiere die Operation auf beiden Seiten. Prüfe anschließend durch Einsetzen.',
 base:[
 N('Löse die Gleichung.'+EQ('5x − 7 = 18'),5,'Auf beiden Seiten + 7: 5x = 25. Dann durch 5 teilen: x = 5.',{'11/5':'inverse','25':'inverse'}),
 M('Welche Lösung hat die Gleichung?'+EQ('−3x = 21'),['x = 7','x = 18','x = −7','x = −18'],2,'Durch −3 teilen ergibt x = −7.',{0:'sign',1:'inverse',3:'inverse'})],
 probes:[
 N('Bestimme x.'+EQ('x + 6 = 15'),9,'Auf beiden Seiten 6 abziehen: x = 9.',{'21':'inverse'}),
 N('Bestimme x.'+EQ('−2x = 10'),-5,'10 geteilt durch −2 ist −5.',{'5':'sign','-20':'inverse'})],
 practice:[[
 O('Wähle auf beiden Seiten die Operation, die x freistellt.'+EQ('−4x = 28'),['÷ (−4)','÷ 4','+ 4'],0,'Durch −4 teilen: x = −7. Die negative Lösung ergibt eingesetzt wieder +28.',{after:['x','−7'],tip:'x wird mit −4 multipliziert.',help:'Die Umkehroperation zum Multiplizieren mit −4 ist das Teilen durch −4. Positiv geteilt durch negativ ergibt negativ.'}),
 N('Löse selbstständig.'+EQ('6x − 5 = 31'),6,'+ 5 ergibt 6x = 36, dann ÷ 6: x = 6.',{}, {tip:'Beginne mit der Operation, die − 5 aufhebt.',help:'Die Rechenkette ist x → mal 6 → minus 5. Gehe vom Ergebnis aus in umgekehrter Reihenfolge zurück.'})],[
 N('Eine Rechenmaschine multipliziert x mit 4 und zieht dann 9 ab. Das Ergebnis ist 23. Wie groß ist x?'+EQ('x → × 4 → − 9 → 23'),8,'23 + 9 = 32 und 32 ÷ 4 = 8.',{}, {tip:'Gehe die Rechenmaschine von rechts nach links durch.',help:'Erst + 9, dann ÷ 4. Kontrolliere danach von links nach rechts.'}),
 N('Löse die Gleichung.'+EQ('−6x + 8 = 50'),-7,'− 8 ergibt −6x = 42; ÷ (−6) ergibt x = −7.',{}, {tip:'Entferne zuerst den Beitrag + 8.',help:'Nach dem Abziehen von 8 teilst du beide Seiten durch den vollständigen Faktor −6, einschließlich Minuszeichen.'})]],
 checks:[[
 N('Löse die Gleichung.'+EQ('7x + 3 = 38'),5,'− 3, dann ÷ 7 ergibt x = 5.',{'41/7':'inverse'}),
 M('Welche Lösung ist richtig?'+EQ('−5x = 30'),['x = 6','x = −25','x = −6','x = 25'],2,'30 ÷ (−5) = −6.',{0:'sign',1:'inverse',3:'inverse'}),
 N('Löse die Gleichung.'+EQ('6x − 8 = 34'),7,'+ 8 und ÷ 6 ergibt x = 7.',{'13/3':'inverse'})],[
 N('Bestimme x.'+EQ('8x − 9 = 55'),8,'+ 9 ergibt 8x = 64, dann x = 8.',{'23/4':'inverse'}),
 M('Welche Zahl erfüllt die Gleichung?'+EQ('−7x = 63'),['x = 9','x = 56','x = −9','x = −56'],2,'63 ÷ (−7) = −9.',{0:'sign',1:'inverse',3:'inverse'}),
 N('Löse die Gleichung.'+EQ('9x + 4 = 85'),9,'− 4 und ÷ 9 ergibt x = 9.',{'89/9':'inverse'})]]},
{id:'sides',name:'Variable auf beiden Seiten',grade:8,goal:'Variable Terme zusammenführen; keine, eine und unendlich viele Lösungen unterscheiden.',source:'SMART; Otten et al. (2019)',tip:'Sammle die x-Terme auf einer Seite, indem du auf beiden Seiten denselben Term addierst oder abziehst.',strategy:'Prüfe die Schlusszeile: x = Zahl, wahre Aussage ohne x oder falsche Aussage ohne x.',
 base:[
 N('Löse die Gleichung.'+EQ('5x + 3 = 2x + 18'),5,'− 2x und − 3 ergibt 3x = 15, also x = 5.',{'3':'oneSide','21/7':'oneSide'}),
 M('Auf beiden Seiten wird x abgezogen. Welche Zeile entsteht?'+EQ('4x + 6 = x + 15'),['3x + 6 = x + 15','3x + 6 = 15','4x + 6 = 15','5x + 6 = 15'],1,'(4x + 6) − x = (x + 15) − x, also 3x + 6 = 15.',{0:'oneSide',2:'oneSide',3:'sign'})],
 probes:[
 N('Links und rechts stehen Kästchen mit demselben Wert. Bestimme x.'+EQ('3x + 2 = x + 10'),4,'Ein Kästchen auf beiden Seiten entfernen: 2x + 2 = 10. Daher x = 4.',{}, {representation:'Vereinfachte Gleichung mit Variable auf beiden Seiten'}),
 M('Welche Lösungsmenge besitzt die Gleichung?'+EQ('2x + 5 = 2x + 9'),['Nur x = 0','Alle reellen Zahlen','Keine Lösung','Nur x = 4'],2,'Nach − 2x bleibt 5 = 9. Das ist falsch, daher gibt es keine Lösung.',{0:'allNone',1:'allNone',3:'allNone'})],
 practice:[[
 O('Die x-Terme rechts sollen verschwinden. Wähle die passende Operation auf beiden Seiten.'+EQ('6x + 4 = 2x + 20'),['− 2x','− 4','+ 2x'],0,'− 2x auf beiden Seiten ergibt 4x + 4 = 20.',{after:['4x + 4','20'],tip:'Welcher x-Term steht rechts?',help:'Entferne rechts 2x. Dafür ziehst du denselben Term 2x auch links ab.'}),
 N('Löse die Gleichung.'+EQ('7x − 2 = 3x + 22'),6,'− 3x ergibt 4x − 2 = 22; + 2 und ÷ 4 ergibt x = 6.',{}, {tip:'Ziehe auf beiden Seiten 3x ab.',help:'Damit bleibt links 4x und rechts kein x-Term. Hebe danach −2 auf und teile durch den Faktor von x.'})],[
 N('Löse und prüfe beide Seiten.'+EQ('8x + 7 = 5x + 28'),7,'− 5x und − 7: 3x = 21, also x = 7.',{}, {tip:'Sammle die x-Terme zuerst links.',help:'Ziehe 5x auf beiden Seiten ab, danach 7. Die Probe vergleicht 8 · 7 + 7 mit 5 · 7 + 28.'}),
 M('Welche Aussage zur Lösungsmenge stimmt?'+EQ('3(x + 2) = 3x + 6'),['Nur x = 0','Keine Lösung','Alle reellen Zahlen','Nur x = 2'],2,'Links ausmultipliziert ergibt 3x + 6. Beide Seiten sind für jedes reelle x gleich.',{}, {tip:'Multipliziere links aus und vergleiche.',help:'Entsteht nach dem Zusammenfassen eine wahre Aussage wie 6 = 6, ist x beliebig. Bei einer falschen Aussage gibt es keine Lösung.'})]],
 checks:[[
 N('Löse die Gleichung.'+EQ('5x − 4 = 3x + 12'),8,'− 3x, + 4 und ÷ 2 ergibt x = 8.'),
 M('Welche Lösungsmenge hat die Gleichung?'+EQ('2(x + 7) = 2x + 14'),['Keine Lösung','Alle reellen Zahlen','Nur x = 0','Nur x = 7'],1,'Beide Seiten sind identisch; alle reellen Zahlen erfüllen die Gleichung.',{0:'allNone',2:'allNone',3:'allNone'}),
 N('Bestimme x.'+EQ('9x + 2 = 6x + 29'),9,'− 6x und − 2: 3x = 27, also x = 9.')],[
 N('Löse die Gleichung.'+EQ('7x + 5 = 4x + 35'),10,'− 4x und − 5: 3x = 30, also x = 10.'),
 M('Welche Lösungsmenge ist richtig?'+EQ('4x − 6 = 4x + 2'),['Nur x = 0','Alle reellen Zahlen','Keine Lösung','Nur x = 8'],2,'− 4x ergibt −6 = 2. Das ist falsch; keine Lösung.',{0:'allNone',1:'allNone',3:'allNone'}),
 N('Löse die Gleichung.'+EQ('6x − 3 = 2x + 41'),11,'− 2x und + 3: 4x = 44, also x = 11.')]]},
{id:'structure',name:'Klammern und feste Nenner',grade:8,goal:'Distributivgesetz und feste Nenner beim Lösen linearer Gleichungen berücksichtigen.',source:'Tendere & Mutambara (2020): algebraische Voraussetzungen; eigene Aufgaben',tip:'Achte auf den Umfang der Operation: Die Klammer und der Bruchstrich fassen jeweils einen ganzen Term zusammen.',strategy:'Kontrolliere nach dem Ausmultiplizieren oder Multiplizieren mit dem Nenner jeden Summanden. Prüfe die Lösung in der Ausgangsgleichung.',

const plain=html=>{const el=document.createElement('div');el.innerHTML=html;return el.textContent.replace(/\s+/g,' ').trim()};
function gcd(a,b){while(b){let r=a%b;a=b;b=r}return a||1}
function Q(n,d=1){if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||d===0)throw Error('number');if(d<0){n=-n;d=-d}const g=gcd(Math.abs(n),d);return [n/g,d/g]}
const add=(a,b)=>Q(a[0]*b[1]+b[0]*a[1],a[1]*b[1]);
const neg=a=>Q(-a[0],a[1]);
const mul=(a,b)=>Q(a[0]*b[0],a[1]*b[1]);
const div=(a,b)=>Q(a[0]*b[1],a[1]*b[0]);

function pmul(a,b){const out=Array.from({length:5},()=>Q(0));for(let i=0;i<3;i++)for(let j=0;j<3;j++)out[i+j]=add(out[i+j],mul(a[i],b[j]));if(out[3][0]||out[4][0])throw Error('degree');return out.slice(0,3)}
function polynomial(raw){
 let s=String(raw).trim().toLowerCase().replace(/−|–/g,'-').replace(/·|×/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/,/g,'.').replace(/\s/g,'');
 if(!s||s.length>140)throw Error('syntax');const tokens=s.match(/(?:\d+(?:\.\d*)?|\.\d+)|x|[()+*\-/^]/g);
 if(!tokens||tokens.join('')!==s||tokens.length>90)throw Error('syntax');let i=0,depth=0;
 function atom(){if(++depth>20)throw Error('depth');let out;const t=tokens[i++];if(t==='('){out=expression();if(tokens[i++]!==')')throw Error('syntax')}else if(t==='x'){out=[Q(0),Q(1),Q(0)]}else if(t&&/^(\d|\.)/.test(t)){const a=t.split('.');if((a[1]?.length||0)>8)throw Error('precision');const den=10**(a[1]?.length||0),num=Number(a[0]||'0')*den+Number(a[1]||0);out=[Q(num,den),Q(0),Q(0)]}else throw Error('syntax');depth--;return out}
 function power(){let a=atom();if(tokens[i]==='^'){i++;const e=tokens[i++];if(!/^[012]$/.test(e||''))throw Error('power');let out=[Q(1),Q(0),Q(0)];for(let k=0;k<Number(e);k++)out=pmul(out,a);a=out}return a}
 function unary(){if(tokens[i]==='+'){i++;return unary()}if(tokens[i]==='-'){i++;return pneg(unary())}return power()}
 function term(){let a=unary();while(i<tokens.length){const t=tokens[i];if(t==='*'||t==='/'){i++;const b=unary();if(t==='*')a=pmul(a,b);else{if(b[1][0]||b[2][0])throw Error('denominator');a=a.map(v=>div(v,b[0]))}}else if(t==='x'||t==='('||/^(\d|\.)/.test(t)){a=pmul(a,unary())}else break}return a}
 function expression(){let a=term();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],b=term();a=padd(a,op==='-'?pneg(b):b)}return a}
 const out=expression();if(i!==tokens.length)throw Error('syntax');return out;
}
function scalar(s){const p=polynomial(s);if(p[1][0]||p[2][0])throw Error('variable');return p[0]}
function solutions(raw){
 let s=String(raw).trim().toLowerCase().replace(/−|–/g,'-').replace(/x(?:[12₁₂]|_[12])?\s*=/g,'').replace(/^l\s*=/,'').trim();
 if(/^(?:keine(?:\s+(?:reelle[n]?\s+)?lösungen?)?|keine\s+lösung|∅|\{\s*\}|none)$/.test(s))return 'none';
 if(/^(?:alle(?:\s+reellen?\s+zahlen)?|r|ℝ)$/.test(s))return 'all';
 s=s.replace(/^\{/,'').replace(/\}$/,'').replace(/\s+(?:oder|und)\s+/g,';');const a=s.split(';');if(!a.length||a.length>6||a.some(x=>!x.trim()))throw Error('syntax');
 const unique=new Map(a.map(v=>{let q=scalar(v);return [qstr(q),q]}));return [...unique.values()].sort((a,b)=>a[0]/a[1]-b[0]/b[1]);
}
function expectedSolutions(t){if(t.answer[0]==='none'||t.answer[0]==='all')return t.answer[0];return t.answer.map(x=>typeof x==='number'?Q(x):scalar(x)).sort((a,b)=>a[0]/a[1]-b[0]/b[1])}
function evaluate(t,a){

  if(t.type==='expr'){value=polynomial(a);correct=value.every((q,i)=>same(q,Q(t.coeff[i]||0)));key=value.map(qstr).join(';')}
  if(t.type==='mc'){if(!Number.isInteger(a)||a<0||a>=t.opts.length)throw Error('selection');correct=a===t.c;key=String(a)}
  if(t.type==='pick'){if(!Array.isArray(a)||a.some(x=>!Number.isInteger(x)||x<0||x>=t.opts.length))throw Error('selection');const v=[...new Set(a)].sort((x,y)=>x-y),ex=[...t.correct].sort((x,y)=>x-y);correct=JSON.stringify(v)===JSON.stringify(ex);key=v.join(';')}
  if(t.type==='operation'){if(!Array.isArray(a)||a.length!==2||a.some(x=>!Number.isInteger(x)||x<0||x>=t.opts.length))throw Error('selection');correct=a.every(x=>x===t.c);key=a.join(';');if(!correct&&a[0]!==a[1])return {valid:true,correct:false,tag:'oneSide',key}}
  return {valid:true,correct,tag:correct?null:(t.tags?.[key]||null),key};
 }catch(e){return {valid:false,message:t.type==='expr'?'Der Term ist noch nicht lesbar. Nutze x, +, −, *, / und Klammern; schreibe hier einen Term ohne Gleichheitszeichen.':'Die Eingabe ist noch nicht lesbar. Nutze Zahlen, Brüche mit / oder Dezimalzahlen. Trenne mehrere Lösungen mit ; . Ein Nenner darf nicht null sein.'}}

function answerText(t,a){if(a===null)return '—';if(t.type==='mc')return plain(t.opts[a]??'—');if(t.type==='pick')return a?.length?a.map(i=>plain(t.opts[i])).join('; '):'Keine der angebotenen Zahlen';if(t.type==='operation')return `links ${t.opts[a?.[0]]??'—'}; rechts ${t.opts[a?.[1]]??'—'}`;return String(a)}
function correctText(t){if(t.type==='mc')return plain(t.opts[t.c]);if(t.type==='pick')return t.correct.map(i=>t.opts[i]).join('; ');if(t.type==='operation')return `links und rechts ${t.opts[t.c]}`;if(t.type==='expr')return [t.coeff[2]?`${t.coeff[2]}x²`:null,t.coeff[1]?`${t.coeff[1]}x`:null,t.coeff[0]?String(t.coeff[0]):null].filter(Boolean).join(' + ').replace(/\+ -/g,'− ')||'0';if(t.answer[0]==='none')return 'Keine reelle Lösung';if(t.answer[0]==='all')return 'Alle reellen Zahlen';return t.answer.join('; ')}

function generalInfo(){return `<details class="teacher-info"><summary>Lehrende</summary><details><summary>Ablauf, Zielgruppe und Grenzen</summary><p>Klassen 7–10, auswählbare Inhalte. Die Klassenstufe setzt nur eine Vorauswahl; passen Sie diese an den tatsächlich behandelten Stoff an. Die vollständige Auswahl enthält sieben Diagnosebereiche. Keine curriculare Vollständigkeitsbehauptung.</p><p><b>Blau: Basisniveau. Gelb: Gegenprobe / diagnostische Vertiefung.</b> Diese Farben bewerten keine Antwort. Zwei unabhängige Basisimpulse je Bereich, mindestens eine freie Antwort oder mathematische Handlung. Bei Auffälligkeiten folgen zwei vereinfachte Gegenproben. Bei zwei sicheren Basisleistungen endet der Pfad direkt.</p><p>Die Eingangsdiagnose dauert bei einer umfassenden Auswahl ungefähr 15–20 Minuten; vertiefte Pfade und anschließende Förderung können mehr Zeit benötigen. Keine feste Aufgabenanzahl und kein Zeitdruck. Jede Aufgabe stammt aus der eingebetteten, vorab festgelegten Aufgabenbank mit 98 Aufgaben.</p><p>Profil → je auffälligem Bereich zwei aufeinander aufbauende Förderaufgaben → bewusste Übergangsseite → neutraler Gleichungsprofi-Check mit zwei neuen Aufgaben und bei uneindeutigem Befund höchstens einer Klärungsaufgabe. Höchstens zwei Förderzyklen je Bereich. Förderung zählt nie als selbstständiger diagnostischer Nachweis.</p><p>Nicht enthalten: Gleichungssysteme, Gleichungen mit variablen Nennern und allgemeine quadratische Gleichungen mit irrationalen Lösungen. Die p-q-Formel wird nicht gesondert diagnostiziert. Quadratische Gleichungen werden hier durch Quadratbetrachtung und Faktorisieren geprüft. Der Trainer arbeitet über den reellen Zahlen.</p><p>Der Trainer ist eine didaktisch konstruierte Lernhilfe, kein wissenschaftlich normierter Test. Einzelne Fehlantworten belegen keine Fehlvorstellung. Die Lehrendenansicht zeigt Antworten, vorsichtige Interpretationen und die konkrete Evidenz getrennt.</p></details><details><summary>Feedbackkonzept</summary><p>Das Feedbackkonzept wurde auf Grundlage der Arbeiten von Hattie und Timperley sowie Shute entwickelt. Die vier Bausteine Fehlerbeschreibung, möglicher Denkweg, konkreter Tipp und Lernstrategie sind unsere didaktische Umsetzung dieser Forschungsgrundlagen.</p><p>Die Struktur wird aus dem Master-Prompt V9 übernommen. Sie ist kein als Ganzes validiertes Diagnoseverfahren. Nach der Diagnose erscheinen konkrete Beobachtungen; ein möglicher Denkweg wird nur bei mindestens zwei passenden Beobachtungen benannt. In der Förderung geben „Tipp“ und „Hilfe“ gestufte Unterstützung. Bei unbekannten Antworten wird kein Fehlermuster erfunden.</p></details><details><summary>Diagnose-Matrix und Einstufungsregeln</summary><p><b>Sicher:</b> zwei unabhängige richtige Basisleistungen auf dem Zielniveau, darunter mindestens eine eigene mathematische Handlung. Im Profi-Check müssen zwei neue richtige Zielaufgaben vorliegen; bei Bedarf wird eine dritte Aufgabe zur Klärung eingesetzt.</p><p><b>Noch festigen:</b> mindestens zwei auswertbare Fehlleistungen auf dem Zielniveau, oder eine Fehlleistung auf dem Zielniveau bei gleichzeitig zwei sicheren Grundlagen-Gegenproben. <b>Weiter aufbauen:</b> beide Grundlagen-Gegenproben sind falsch. <b>Noch nicht eindeutig einschätzbar:</b> zu wenig Evidenz, überwiegend Unsicherheit, übersprungene oder widersprüchliche Leistungen ohne tragfähige Zuordnung. <b>Nicht geprüft:</b> keine Aufgabe bearbeitet.</p><p>Ein Fehleranteil entscheidet nicht über den Status. „Ich bin mir nicht sicher“ und „Überspringen“ sind keine fachlich falschen Antworten. Ein unklarer Befund führt zu einem Gesprächshinweis. Andere klar auffällige Bereiche können weiter gefördert werden. Bei vorzeitigem Abschluss ist das Profil ausdrücklich unvollständig.</p><div class="table-wrap"><table><thead><tr><th>Bereich / Ziel</th><th>Formate und Gegenproben</th><th>Förderung / Transfer</th></tr></thead><tbody>${DIMS.map(d=>`<tr><td><b>${esc(d.name)}</b><br>${esc(d.goal)}</td><td>${d.base.map(t=>({number:'Freie Lösung',mc:'Konzeptauswahl',expr:'Freier Term',pick:'Lösungen markieren'}[t.type])).join(' + ')}<br>Bei Auffälligkeit: ${d.probes.map(t=>({number:'vereinfachte freie Lösung',mc:'isolierte Konzeptfrage',expr:'vereinfachter freier Term',pick:'Markierung'}[t.type])).join(' + ')}</td><td>Zwei Aufgaben pro Zyklus: strukturierter Zugang → selbstständiger Transfer. Zwei neue Zielaufgaben; höchstens eine Klärung.<br><span class="small">${esc(d.source)}</span></td></tr>`).join('')}</tbody></table></div></details><details><summary>Quellen und fachliche Orientierung</summary><p>Die Aufgaben wurden für diesen Trainer neu konstruiert. Die folgenden Quellen begründen die Auswahl der Konzepte und Darstellungen; sie liefern keine normierten Schwellenwerte für dieses Programm.</p><p>SMART, University of Melbourne: <a href="https://www.smartvic.com/smart/usesmart/conceptualgrowth.html" target="_blank" rel="noopener">Using smart tests – conceptual growth</a>. Orientierung: Antwortmuster statt bloßem Fehleranteil; Gleichheitszeichen als Beziehung.</p><p>Otten, M., Van den Heuvel-Panhuizen, M. &amp; Veldhuis, M. (2019). <i>The balance model for teaching linear equations: a systematic literature review.</i> International Journal of STEM Education, 6, 30. <a href="https://doi.org/10.1186/s40594-019-0183-2" target="_blank" rel="noopener">DOI / Volltext</a>. Orientierung: Gleichheit, gleiche Operationen auf beiden Seiten, Grenzen des Waagenmodells. Die Waage wird hier nur bei nichtnegativen Größen verwendet.</p><p>Tendere, J. &amp; Mutambara, L. H. N. (2020). <i>An analysis of errors and misconceptions in the study of quadratic equations.</i> European Journal of Mathematics and Science Education, 1(2), 81–90. <a href="https://doi.org/10.12973/ejmse.1.2.81" target="_blank" rel="noopener">DOI / Artikel</a>. Orientierung: begriffliche und prozedurale Schwierigkeiten sowie algebraische Voraussetzungen und Wechsel zwischen Symbolen und Sachtext.</p><p>Illustrative Mathematics (2016): <a href="https://tasks.illustrativemathematics.org/content-standards/HSA/REI/A/1/tasks/2141" target="_blank" rel="noopener">Zero Product Property 1</a>. Orientierung: Produktstruktur begründen und Faktoren getrennt betrachten. Keine Originalaufgaben werden übernommen.</p><p>Feedbackrahmen aus dem Projekt-Master-Prompt: Hattie, J. &amp; Timperley, H. (2007). <i>The power of feedback.</i> Review of Educational Research, 77(1), 81–112. DOI: <a href="https://doi.org/10.3102/003465430298487" target="_blank" rel="noopener">10.3102/003465430298487</a>. Shute, V. J. (2007). <i>Focus on formative feedback.</i> ETS Research Report RR-07-11. DOI: <a href="https://doi.org/10.1002/j.2333-8504.2007.tb02053.x" target="_blank" rel="noopener">10.1002/j.2333-8504.2007.tb02053.x</a>. Bibliografische Angaben aus Master-Prompt V9.</p><p class="small">Die Bruchdimensionen aus V9 werden fachlich nicht auf Gleichungen übertragen. Für dieses neue Thema gilt die hier offen dokumentierte Diagnose-Matrix. Padberg und Wittmann werden nicht als ungeprüfte Quellen für konkrete Gleichungsfehler angeführt.</p></details><details><summary>Bedienung, Datenschutz und Veröffentlichung</summary><p>Alle Kernfunktionen, Grafiken und Aufgaben sind in dieser Datei enthalten. Kein Internet und keine Anmeldung nötig. Lernstand und Antworten werden ausschließlich lokal in diesem Browser gespeichert; es werden keine Namen abgefragt. „Neu beginnen“ löscht den bisherigen lokalen Lernstand. Bei blockiertem Speicher funktioniert die laufende Sitzung trotzdem.</p><p>Numerische Eingaben: Zahlen, Brüche a/b, Dezimalzahlen mit Komma oder Punkt, bei mehreren Lösungen Semikolon. „Keine Lösung“ und „alle“ sind bei passenden Aufgaben zulässig. Terme können mit 4x, 4*x, Klammern und ^2 eingegeben werden. Gleichwertige numerische Werte und Terme werden anerkannt. Nicht lesbare Eingaben erhalten einen neutralen Hinweis und zählen nicht als fachlicher Fehler.</p><p>Die Datei kann lokal in Safari oder Firefox geöffnet und als <code>index.html</code> über GitHub Pages veröffentlicht werden. Mit einer veröffentlichten HTTPS-Adresse kann sie in Moodle per Link oder iframe genutzt werden. Diese Dateiausgabe enthält noch keine veröffentlichte Webadresse.</p></details><details><summary>Version und Prüfstatus</summary><p>Version 1.0 · 01.10.2026. Ablauf und Phasentrennung nach Master-Prompt V9; blau-gelbe Niveaukennzeichnung nach V9.1.</p><p id="qaInfo">Automatisierte Funktionsprüfung in Node.js mit einer DOM-Simulation und den tatsächlichen Event-Handlern: alle 98 Aufgaben, sichere und auffällige Lernwege, zwei Förderzyklen, unsichere Antworten, Überspringen, Antwortäquivalenzen, Eingabeprobleme, blockierter Speicher, Unterbrechung und Wiederaufnahme. Mathematische Gleichungen werden zusätzlich unabhängig gegen die hinterlegten Lösungen geprüft. Ein Browser stand für eine gerenderte Ansichtsprüfung nicht zur Verfügung. Responsive CSS und große Touch-Flächen sind vorgesehen; Darstellung und Touch-Verhalten auf echten Geräten sowie native Safari-/Firefox-Tests sind noch offen.</p></details></details>`}
function showStart(){mode('Start');setView(`<section class="card"><div class="eyebrow">Diagnose · Förderung · neuer Check</div><h1>Gleichungen verstehen</h1><p class="lead">Zeige, was du schon sicher kannst. Der Trainer prüft bei Bedarf genauer nach und bietet dir anschließend passende Übungen.</p>${stored?`<div class="resume"><b>Ein Lernstand ist gespeichert.</b><div class="actions"><button id="resume" class="primary">Weiterarbeiten</button><button id="reset" class="secondary">Neu beginnen</button></div></div>`:''}<div class="config"><label for="grade">Klassenstufe</label><select id="grade"><option value="7">Klasse 7</option><option value="8" selected>Klasse 8</option><option value="9">Klasse 9</option><option value="10">Klasse 10</option></select></div><details><summary>Inhalte auswählen</summary><p class="small">Die Klassenstufe trifft eine Vorauswahl. Wähle nur Inhalte, die ihr bereits behandelt habt.</p><div class="checks">${DIMS.map(d=>`<label class="check"><input type="checkbox" value="${d.id}" ${d.grade<=8?'checked':''}><span>${esc(d.name)}</span></label>`).join('')}</div></details><div class="actions"><button id="start" class="primary">Diagnose starten</button></div><p id="startMessage" class="notice" aria-live="polite"></p><p class="small">Gemischte Rechen- und Verständnisaufgaben · Diagnose etwa 15–20 Minuten bei umfassender Auswahl · Übungen anschließend nach Bedarf</p><p class="source-note">Fachliche Orientierung: SMART, Otten et al. und Tendere &amp; Mutambara. Erläuterungen und Quellen im Bereich „Lehrende“.</p>${generalInfo()}</section>`);
 $('#grade').addEventListener('change',e=>document.querySelectorAll('.check input').forEach(el=>el.checked=dim(el.value).grade<=+e.target.value));
 act('start',()=>{const selected=[...document.querySelectorAll('.check input:checked')].map(x=>x.value);if(!selected.length){$('#startMessage').textContent='Bitte wähle mindestens einen Inhalt.';return}S={version:VERSION,grade:+$('#grade').value,selected,phase:'diagnose',di:0,index:0,path:[],results:{},initial:{},log:[],cycles:{},active:[],pi:0,ci:0,draft:null,hints:{tip:false,help:false},practiceResult:null,partial:false,created:new Date().toISOString()};nextTask();save();render()});
 act('resume',()=>{S=structuredClone(stored);render()});act('reset',()=>{if(confirm('Den gespeicherten Lernstand löschen und neu beginnen?')){try{localStorage.removeItem(KEY)}catch(e){}S=null;stored=null;showStart()}})
}
function nextTask(){S.draft=null;S.hints={tip:false,help:false};S.practiceResult=null;S.inputProblems=0}
function current(){if(S.phase==='diagnose'){const d=dim(S.selected[S.di]);return S.index<2?d.base[S.index]:d.probes[S.index-2]}if(S.phase==='practice')return TASKS[S.practiceTasks[S.pi]];if(S.phase==='check')return dim(S.active[S.ci]).checks[S.cycles[S.active[S.ci]]-1][S.index];return null}
function classify(records,check=false,previous='firm'){
 const proper=records.filter(x=>typeof x.correct==='boolean'),wrong=proper.filter(x=>!x.correct),ok=proper.filter(x=>x.correct);
 const target=records.filter(x=>x.level==='base'&&x.correct),own=target.some(x=>TASKS[x.task].own);
 if(target.length>=2&&own)return {status:'safe',reason:'Zwei unabhängige richtige Leistungen auf dem Zielniveau, darunter eine eigene mathematische Handlung.'};
 if(records.some(x=>x.outcome==='skipped')||records.some(x=>x.outcome==='input'))return {status:'open',reason:'Eine Aufgabe wurde übersprungen oder war technisch nicht auswertbar. Die Evidenz reicht für eine eindeutige Einstufung nicht aus.'};
 if(!check){const basics=records.filter(x=>x.level==='deep');if(basics.length===2&&basics.every(x=>x.correct===false))return {status:'build',reason:'Beide unabhängigen vereinfachten Gegenproben wurden falsch beantwortet.'};
 if(wrong.length>=2)return {status:'firm',reason:'Mindestens zwei auswertbare Fehlleistungen; Grundlagen sind nicht wiederholt eindeutig als unsicher belegt.'};
 if(wrong.length===1&&basics.length===2&&basics.every(x=>x.correct===true))return {status:'firm',reason:'Eine Fehlleistung auf dem Zielniveau bei zwei sicheren Grundlagen-Gegenproben.'};
 }else if(wrong.length>=2)return {status:previous==='build'?'build':'firm',reason:'Mindestens zwei neue Fehlleistungen im neutralen Profi-Check. Der Bereich bleibt förderwürdig.'};
 return {status:'open',reason:'Zu wenig übereinstimmende Evidenz oder widersprüchliche Antworten. Ein Gespräch über den Lösungsweg ist sinnvoll.'};
}
function feedbackFor(id,records){const repeated={};for(const r of records){if(r.correct===false&&r.tag)repeated[r.tag]=(repeated[r.tag]||0)+1}const tag=Object.keys(repeated).find(k=>repeated[k]>=2),wrong=records.find(r=>r.correct===false),open=S.results[id]?.status==='open';return {tag,observation:wrong?`Bei „${plain(TASKS[wrong.task].q)}“ hast du „${answerText(TASKS[wrong.task],wrong.answer)}“ angegeben. Diese Antwort passt nicht zur Aufgabe.`:open?'Die Antworten geben noch kein ausreichend klares Bild.':'Die geprüften Aufgaben auf dem Zielniveau wurden übereinstimmend richtig bearbeitet.',interpretation:tag?TAGS[tag]:wrong?'Aus den vorliegenden Antworten lässt sich kein bestimmter Denkweg sicher ableiten.':null};}

function renderTask(){const t=current(),d=dim(t.dim),pr=S.phase==='practice',re=S.phase==='check';mode(pr?'Jetzt wird geübt':re?'Neutraler Profi-Check':'Neutrale Diagnose');const done=pr?S.pi:re?S.ci:S.di,total=pr?S.practiceTasks.length:re?S.active.length:S.selected.length;
 setView(`<section class="card"><div class="eyebrow">${pr?'Individuelle Förderung':re?'Gleichungsprofi-Check':'Eingangsdiagnose'}</div><div class="progress" role="progressbar" aria-label="Bearbeitete Bereiche" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.floor(done/total*100)}"><span style="width:${done/total*100}%"></span></div><p class="small">${pr?'Übe den Bereich, an dem du gerade arbeitest.':`Bereits abgeschlossen: ${done} von ${total} Bereichen. Bei Bedarf prüft der Trainer genauer nach.`}</p><div class="task ${pr?'practice':t.level==='deep'?'deep':''}"><div class="level">${pr?`Üben · Runde ${(S.cycles[t.dim]||0)+1}`:t.level==='deep'?'Gelb · Gegenprobe / Vertiefung':'Blau · Basisniveau'}</div><h2>${esc(d.name)}</h2><div class="question">${t.q}</div>${t.visual||''}<div id="interaction"></div>${pr?currentFeedback(t):''}<div id="practiceFeedback">${pr&&S.practiceResult?practiceFeedbackHTML(t):''}</div></div><p id="message" class="error" role="status" aria-live="polite"></p><div class="actions"><button id="send" class="primary">${pr?((S.practiceResult?.correct||S.practiceResult?.revealed)?'Nächste Übung':'Antwort prüfen'):'Antwort speichern und weiter'}</button>${pr?'':`<button id="unsure" class="secondary">Ich bin mir nicht sicher</button><button id="skip" class="quiet">Überspringen</button><button id="inputSkip" class="quiet" ${S.inputProblems>=2?'':'hidden'}>Eingabeproblem melden und weiter</button>`}</div>${pr&&S.practiceResult&&!S.practiceResult.correct?'<div class="actions"><button id="explain" class="secondary">Lösung erklären lassen</button></div>':''}<div class="actions no-print"><button id="pause" class="quiet">Pause</button><button id="early" class="quiet">${pr?'Förderung beenden':'Diagnose vorzeitig beenden'}</button></div>${pr?'':`<p class="small">Hier gibt es keine Tipps und keine Rückmeldung zur Richtigkeit. Deine Antwort wird gespeichert.</p>`}</section>`);
 renderInteraction(t);act('send',()=>{if(pr&&S.practiceResult?.correct){nextPractice();return}submit()});act('unsure',()=>submit('unsure'));act('skip',()=>submit('skipped'));act('inputSkip',()=>submit('input'));act('pause',()=>{save();stored=structuredClone(S);showStart()});act('early',earlyFinish);

function renderInteraction(t){const h=$('#interaction');
 if(t.type==='number'||t.type==='expr'){
  h.innerHTML=`<label for="answer">${t.type==='expr'?'Dein Term':'Deine Antwort'}</label><input id="answer" type="text" autocomplete="off" spellcheck="false" value="${esc(S.draft??'')}" aria-describedby="syntax"><div class="token-row no-print">${(t.type==='expr'?['x','(',')','^2','/']:['−','/',';']).map(v=>`<button type="button" class="token" data-value="${esc(v)}" aria-label="${esc(v)} einfügen">${esc(v)}</button>`).join('')}</div><p class="syntax" id="syntax">${t.type==='expr'?'Terme: x, +, −, * oder ·, /, Klammern und ^2. 4x und 4*x sind beide möglich.':'Zahlen, Brüche mit /, Dezimalzahlen mit Komma oder Punkt. Mehrere Lösungen mit ; trennen. Bei passenden Aufgaben: „keine Lösung“ oder „alle“. „x = …“ ist ebenfalls möglich.'}</p>`;
  const inp=$('#answer');inp.addEventListener('input',()=>{S.draft=inp.value;clearPracticeResult();save()});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#send').click()}});
  h.querySelectorAll('.token').forEach(b=>b.addEventListener('click',()=>{const a=inp.selectionStart??inp.value.length,z=inp.selectionEnd??a;inp.value=inp.value.slice(0,a)+b.dataset.value+inp.value.slice(z);S.draft=inp.value;inp.focus();inp.setSelectionRange(a+b.dataset.value.length,a+b.dataset.value.length);clearPracticeResult();save()}));
 }
 if(t.type==='mc'){h.innerHTML=t.opts.map((o,i)=>`<button class="choice ${S.draft===i?'selected':''}" type="button" data-i="${i}" aria-pressed="${S.draft===i}">${o}</button>`).join('');h.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{S.draft=+b.dataset.i;clearPracticeResult();save();h.querySelectorAll('.choice').forEach(x=>{let sel=+x.dataset.i===S.draft;x.classList.toggle('selected',sel);x.setAttribute('aria-pressed',String(sel))})}))}
 if(t.type==='pick'){h.innerHTML=`<p class="syntax">Tippe alle passenden Zahlen an. Du kannst eine Auswahl wieder entfernen.</p><div class="select-grid">${t.opts.map((o,i)=>`<button type="button" class="choice ${S.draft?.includes(i)?'selected':''}" data-i="${i}" aria-pressed="${Boolean(S.draft?.includes(i))}">${o}</button>`).join('')}</div><button type="button" id="nonePick" class="quiet" aria-pressed="${Array.isArray(S.draft)&&S.draft.length===0}">Keine dieser Zahlen</button><p id="picked" class="syntax" aria-live="polite"></p>`;const update=()=>{h.querySelectorAll('.choice').forEach(x=>{let sel=S.draft?.includes(+x.dataset.i);x.classList.toggle('selected',!!sel);x.setAttribute('aria-pressed',String(!!sel))});$('#nonePick').setAttribute('aria-pressed',String(Array.isArray(S.draft)&&!S.draft.length));$('#picked').textContent=S.draft===null?'Noch keine Auswahl':`Ausgewählt: ${answerText(t,S.draft)}`};h.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{const n=+b.dataset.i;S.draft=S.draft||[];S.draft=S.draft.includes(n)?S.draft.filter(x=>x!==n):[...S.draft,n];clearPracticeResult();update();save()}));act('nonePick',()=>{S.draft=[];clearPracticeResult();update();save()});update()}
 if(t.type==='operation'){h.innerHTML=`<div class="operation-grid">${['links','rechts'].map((side,i)=>`<label>Operation ${side}<select data-side="${i}" aria-label="Operation ${side}"><option value="">Bitte wählen</option>${t.opts.map((o,j)=>`<option value="${j}" ${S.draft?.[i]===j?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`).join('')}</div><p class="syntax">Beide ausgewählten Operationen werden als deine mathematische Handlung gespeichert.</p>`;h.querySelectorAll('select').forEach(el=>el.addEventListener('change',()=>{S.draft=S.draft||[null,null];S.draft[+el.dataset.side]=el.value===''?null:+el.value;clearPracticeResult();save()}))}
}
function practiceFeedbackHTML(t){const r=S.practiceResult;if(!r)return '';if(r.correct)return `<div class="answer-feedback good" role="status"><b>Das ist richtig.</b><p>${esc(t.explain)}</p>${t.after?EQ(esc(t.after[0])+' = '+esc(t.after[1])):''}</div>`;return `<div class="answer-feedback again" role="status"><b>Diese Antwort passt noch nicht.</b><p>${r.tag?esc(TAGS[r.tag]):'Prüfe die Antwort mit „Tipp“ oder „Hilfe“ und versuche es erneut.'}</p>${r.revealed?`<p><b>Lösung:</b> ${esc(correctText(t))}</p><p>${esc(t.explain)}</p><p class="small">Mit Erklärung bearbeitet. Erst der neue Profi-Check zeigt selbstständiges Können.</p>`:''}</div>`}
function practiceSubmit(){const t=current();if(S.practiceResult?.revealed){nextPractice();return}const ev=evaluate(t,S.draft);if(!ev.valid){$('#message').textContent=ev.message;return}const logged=recordAnswer('answered',ev);logged.feedback=ev.correct?t.explain:ev.tag?TAGS[ev.tag]:'Prüfe die Antwort mit Tipp oder Hilfe und versuche es erneut.';S.practiceResult={correct:ev.correct,tag:ev.tag,revealed:false};save();renderTask()}
function beginPractice(){S.active=S.selected.filter(id=>['firm','build'].includes(S.results[id]?.status)&&(S.cycles[id]||0)<2);if(!S.active.length)return;S.practiceTasks=S.active.flatMap(id=>dim(id).practice[S.cycles[id]||0].map(t=>t.id));S.pi=0;S.phase='practice';nextTask();save();render()}
function nextPractice(){S.pi++;nextTask();if(S.pi>=S.practiceTasks.length){for(const id of S.active)S.cycles[id]=(S.cycles[id]||0)+1;S.phase='transition'}save();render()}
function transition(){mode('Übung abgeschlossen');setView(`<section class="card"><div class="eyebrow">Bewusster Wechsel in den Testmodus</div><h1>Dein Übungsteil ist abgeschlossen.</h1><p class="lead">Jetzt kannst du zeigen, was du gelernt hast.</p><p>Im Gleichungsprofi-Check werden nur die Bereiche geprüft, an denen du gerade gearbeitet hast. Du erhältst neue Aufgaben. Tipps und Hilfen stehen dort nicht zur Verfügung.</p><p class="small">Bearbeitete Übungen ändern das Diagnoseprofil noch nicht. Dafür zählen die neuen, selbstständig gelösten Aufgaben.</p><div class="actions"><button id="beginCheck" class="primary">Gleichungsprofi-Check starten</button><button id="pause" class="secondary">Pause</button></div></section>`);act('beginCheck',()=>{S.phase='check';S.ci=0;S.index=0;S.path=[];nextTask();save();render()});act('pause',()=>{stored=structuredClone(S);showStart()})}
function earlyFinish(){if(!confirm(S.phase==='practice'?'Förderung jetzt beenden? Nicht abgeschlossene Übungen werden nicht als Lernnachweis gewertet.':'Jetzt beenden? Offene Bereiche bleiben ausdrücklich unvollständig.'))return;
 if(S.phase==='diagnose'){S.partial=true;if(S.path.length||S.index){const id=S.selected[S.di];S.results[id]={status:'open',reason:'Der Diagnosepfad wurde vorzeitig beendet.',records:[...S.path]};S.initial[id]=structuredClone(S.results[id])}}
 if(S.phase==='check'){S.partial=true;for(let i=S.ci;i<S.active.length;i++){const id=S.active[i];S.results[id]={status:'open',reason:'Der Profi-Check wurde nicht vollständig abgeschlossen.',records:i===S.ci?[...S.path]:[],cycles:S.cycles[id]}}}
 S.phase='profile';S.stopped=true;S.active=[];nextTask();save();render()
}
function resultDescription(id){const r=S.results[id];if(!r)return 'Dieser Bereich wurde noch nicht geprüft.';switch(r.status){case 'safe':return 'Du hast die geprüften Aufgaben auf dem Zielniveau selbstständig und übereinstimmend gelöst.';case 'firm':return 'Grundlagen sind erkennbar oder noch offen; auf dem Zielniveau gelingt die Anwendung noch nicht zuverlässig.';case 'build':return 'Bei grundlegenden Aufgaben traten wiederholt Schwierigkeiten auf. Die Übungen setzen dort an.';default:return 'Die Antworten reichen noch nicht für eine eindeutige Einschätzung. Besprich die Aufgabe und deinen Lösungsweg mit Lehrenden.'}}
function profile(){mode('Dein Lernprofil');const pending=S.selected.filter(id=>['firm','build'].includes(S.results[id]?.status)&&(S.cycles[id]||0)<2),open=S.selected.some(id=>S.results[id]?.status==='open'),safe=S.selected.every(id=>S.results[id]?.status==='safe'),maxed=S.selected.filter(id=>['firm','build'].includes(S.results[id]?.status)&&(S.cycles[id]||0)>=2),incomplete=S.partial||S.selected.some(id=>!S.results[id]);
 setView(`<section class="card"><div class="eyebrow">${safe?'Abschluss':'Diagnoseprofil'}</div><h1>${safe?'Die geprüften Bereiche sind sicher.':'Dein Lernprofil'}</h1><p class="lead">${safe?'Du hast gezeigt, dass du die geprüften Inhalte selbstständig anwenden kannst.':'Hier siehst du, was bereits sicher gelingt und woran du weiterarbeiten kannst.'}</p>${incomplete?'<div class="banner"><b>Dieses Profil ist unvollständig.</b> Offene und nicht geprüfte Bereiche gelten weder als sicher noch automatisch als falsch.</div>':''}<div class="profile-grid">${DIMS.map(d=>{const r=S.results[d.id],selected=S.selected.includes(d.id),status=r?.status||'unseen';return `<div class="status ${status}"><strong>${esc(d.name)}</strong><div class="label">${LABEL[status]}</div><p>${!selected?'In dieser Auswahl nicht geprüft.':esc(resultDescription(d.id))}</p>${S.cycles[d.id]?`<p>${S.cycles[d.id]} abgeschlossene Förderrunde${S.cycles[d.id]>1?'n':''}</p>`:''}</div>`}).join('')}</div>${S.selected.filter(id=>S.results[id]?.status&&S.results[id].status!=='safe').map(id=>{const r=S.results[id],fb=feedbackFor(id,r.records);r.feedback=fb;S.feedbackLog=S.feedbackLog||[];const key=id+':'+(S.cycles[id]||0)+':'+r.status;if(!S.feedbackLog.some(x=>x.key===key))S.feedbackLog.push({key,dim:id,cycle:S.cycles[id]||0,...fb});return `<details><summary>${esc(dim(id).name)}: Rückmeldung</summary><div class="feedback"><p><b>Beobachtung:</b> ${esc(fb.observation)}</p>${fb.interpretation?`<p><b>Möglicher Denkweg:</b> ${esc(fb.interpretation)}</p>`:''}${r.status==='open'?`<p>Aus deinen Antworten kann der Trainer noch nicht sicher erkennen, wie du vorgegangen bist. Zeige deiner Lehrerin oder deinem Lehrer die Aufgabe und deinen Lösungsweg. Gemeinsam könnt ihr herausfinden, an welcher Stelle du Unterstützung brauchst.</p>${r.records.filter(x=>x.correct!==true).slice(0,2).map(x=>`<p><b>Aufgabe:</b> ${esc(plain(TASKS[x.task].q))}<br><b>Deine Antwort:</b> ${esc(x.outcome==='answered'?answerText(TASKS[x.task],x.answer):x.outcome==='unsure'?'Ich bin mir nicht sicher':x.outcome==='input'?'Eingabeproblem':'Übersprungen')}</p>`).join('')}`:''}</div></details>`}).join('')}${maxed.length?`<div class="banner"><b>Gemeinsam weiterarbeiten:</b> In ${maxed.map(id=>esc(dim(id).name)).join(', ')} besteht nach zwei Förderrunden noch Bedarf. Besprich die Aufgaben mit Lehrenden.</div>`:''}${open?'<p class="small">Bei offenen Befunden empfiehlt der Trainer ein Gespräch mit Lehrenden und ordnet keine bestimmte Fehlvorstellung zu.</p>':''}<div class="actions no-print">${pending.length?`<button id="practice" class="primary">${pending.some(id=>S.cycles[id])?'Weitere passende Übungen starten':'Passende Übungen starten'}</button>`:''}<button id="report" class="secondary">Lehrendenansicht</button><button id="print" class="secondary">Profil drucken / PDF</button><button id="pause" class="quiet">Pause</button><button id="restart" class="quiet">Neu beginnen</button></div><p class="small">Die Einschätzung gilt für die tatsächlich geprüften Teilbereiche. Nicht ausgewählte Inhalte werden nicht beurteilt.</p>${generalInfo()}</section>`);
 save();act('practice',beginPractice);act('report',()=>{S.phase='report';save();render()});act('print',()=>window.print());act('pause',()=>{stored=structuredClone(S);showStart()});act('restart',()=>{if(confirm('Alle gespeicherten Antworten löschen und neu beginnen?')){try{localStorage.removeItem(KEY)}catch(e){}S=null;stored=null;showStart()}})
}
function outcomeLabel(r){if(r.outcome==='unsure')return 'Unsicher; keine fachliche Fehlleistung';if(r.outcome==='skipped')return 'Übersprungen';if(r.outcome==='input')return 'Eingabeproblem';return r.correct?'Richtig':'Falsch'}
function report(){mode('Lehrendenansicht');setView(`<section class="card report-area"><div class="eyebrow">Beobachtung · Interpretation · Evidenz</div><h1>Lehrendenansicht</h1><p>Klasse ${S.grade} · ${S.partial?'unvollständiger':'abgeschlossener'} Diagnoseweg · ${esc(new Date(S.created).toLocaleDateString('de-DE'))}</p><p class="small">Die Ansicht ist ein didaktischer Bericht, keine geschützte Prüfungsoberfläche. Es werden nur bereits bearbeitete Aufgaben mit Lösungen angezeigt; während Diagnose und Profi-Check ist diese Ansicht nicht erreichbar.</p><div class="table-wrap"><table><thead><tr><th>Bereich</th><th>Erstdiagnose → aktuell</th><th>Evidenz / Konsequenz</th></tr></thead><tbody>${DIMS.map(d=>{const r=S.results[d.id];return `<tr><td>${esc(d.name)}</td><td>${LABEL[S.initial[d.id]?.status||'unseen']} → ${LABEL[r?.status||'unseen']}</td><td>${esc(r?.reason||'Nicht geprüft.')}<br>${S.cycles[d.id]||0} vollständige Förderzyklen</td></tr>`}).join('')}</tbody></table></div>${S.selected.map(id=>`<details><summary>${esc(dim(id).name)} – vollständiger Lernweg</summary>${S.log.filter(r=>r.dim===id).map(r=>{const t=TASKS[r.task];return `<div class="log"><p><span class="chip">${r.phase==='diagnose'?'Erstdiagnose':r.phase==='practice'?'Förderung':'Profi-Check'}${r.cycle?' · Runde '+r.cycle:''}</span><span class="chip">${r.phase==='practice'?'Üben':r.level==='deep'?'Gelb · Gegenprobe':'Blau · Zielniveau'}</span><span class="chip">${esc(t.id)}</span></p><p><b>Aufgabe:</b> ${esc(plain(t.q))}</p><p><b>Antwort:</b> ${esc(r.outcome==='answered'?answerText(t,r.answer):r.outcome==='unsure'?'Ich bin mir nicht sicher':r.outcome==='input'?'Nicht auswertbar':'Übersprungen')}</p><p><b>Beobachtung:</b> ${outcomeLabel(r)}. ${r.phase==='practice'?`Tipp: ${(r.tip||S.aidLog?.some(x=>x.task===r.task&&x.kind==='tip'))?'genutzt':'nicht genutzt'}; Hilfe: ${(r.help||S.aidLog?.some(x=>x.task===r.task&&x.kind==='help'))?'genutzt':'nicht genutzt'}. Kein diagnostischer Lernnachweis.`:''}</p>${r.tag?`<p><b>Diagnostischer Hinweis:</b> Antwort ist mit dem Muster „${esc(r.tag)}“ vereinbar; eine einzelne Antwort belegt dieses Muster nicht.</p>`:''}${r.feedback?`<p><b>Angezeigte Förderrückmeldung:</b> ${esc(r.feedback)}${r.revealed?' · Lösungserklärung geöffnet.':''}</p>`:''}<p><b>Lösung / Einordnung:</b> ${esc(correctText(t))}. ${esc(t.explain)}</p></div>`}).join('')}${S.feedbackLog?.filter(f=>f.dim===id).map(f=>`<div class="feedback"><p><b>Angezeigtes Profilfeedback · nach ${f.cycle} Förderrunden:</b> ${esc(f.observation)}</p>${f.interpretation?`<p>${esc(f.interpretation)}</p>`:''}</div>`).join('')||''}</details>`).join('')}<div class="report-tools no-print"><button id="back" class="primary">Zurück zum Profil</button><button id="reportPrint" class="secondary">Bericht drucken / PDF</button><button id="download" class="secondary">Bericht als Text speichern</button></div>${generalInfo()}</section>`);act('back',()=>{S.phase='profile';save();render()});act('reportPrint',()=>{app.querySelectorAll('.report-area > details').forEach(d=>d.open=true);window.print()});act('download',downloadReport)}
function downloadReport(){const lines=['Gleichungstrainer – Lernbericht','Klasse '+S.grade,'Erstellt: '+S.created,S.partial?'Profil unvollständig':'Diagnose abgeschlossen',''];for(const d of DIMS){const r=S.results[d.id];lines.push(d.name+': '+LABEL[r?.status||'unseen'],r?.reason||'Nicht geprüft.');for(const x of S.log.filter(z=>z.dim===d.id)){const t=TASKS[x.task];lines.push(`[${x.phase}; Zyklus ${x.cycle}; ${x.level}] ${plain(t.q)}`,`Antwort: ${x.outcome==='answered'?answerText(t,x.answer):x.outcome}`,`Beobachtung: ${outcomeLabel(x)}; Tipp ${x.tip||S.aidLog?.some(a=>a.task===x.task&&a.kind==='tip')||false}; Hilfe ${x.help||S.aidLog?.some(a=>a.task===x.task&&a.kind==='help')||false}`,`Lösung: ${correctText(t)}. ${t.explain}`)}lines.push('')}const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Gleichungstrainer_Lernbericht.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function render(){if(!S)return showStart();if(S.phase==='diagnose'||S.phase==='practice'||S.phase==='check')renderTask();else if(S.phase==='transition')transition();else if(S.phase==='report')report();else profile()}
// Kleine, rein lesende Prüfoberfläche für die automatisierte Qualitätsprüfung.
// Sie enthält keine zusätzlichen Lösungen in der Lernendenoberfläche.
window.TrainerQA={tasks:TASKS,dims:DIMS,evaluate,polynomial,solutions,classify,getState:()=>structuredClone(S)};
showStart();

})();
</script>
